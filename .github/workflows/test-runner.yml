name: Test minikube runner

on: workflow_dispatch

jobs:
  test:
    runs-on: [self-hosted, linux, minikube-deploy]

  steps:
    - name: Check tools
      run: |
        whoami
        kubectl version --client
        helm version
    
    - name: Check kubernetes connection
      run: |
        kubectl config current-context
        kubectl get nodes

    - name: Check helm access
      run: |
        helm list -A
