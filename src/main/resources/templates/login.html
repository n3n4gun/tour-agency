<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
    <nav class="site-nav" aria-label="Навигация">
        <a th:href="@{/}">На главную</a>
    </nav>
    <main class="auth-card">
        <h1>Вход в аккаунт</h1>

        <p class="notice" th:if="${param.registered}">
            Регистрация завершена. Теперь вы можете войти.
        </p>

        <p class="notice" th:if="${param.error}" role="alert">
            Не удалось войти. Проверьте email и пароль.
        </p>

        <p class="notice" th:if="${param.logout}">
            Вы вышли из аккаунта.
        </p>

        <form class="auth-form" th:action="@{/login}" method="post">
            <div>
                <label for="username">Email</label>
                <input type="email"
                       id="username"
                       name="username"
                       autocomplete="username"
                       required>
            </div>

            <div>
                <label for="password">Пароль</label>
                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit">Войти</button>
        </form>

        <p>
            Нет аккаунта?
            <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </main>
</body>
</html>
